<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <script>
      /**
       * uni-app H5 的官方入口形态：`viewport-fit=cover` 只能在运行时探测
       * （刘海屏安全区），因此用 `document.write` 注入 viewport。
       */
      var coverSupport =
        'CSS' in window &&
        typeof CSS.supports === 'function' &&
        (CSS.supports('top: env(a)') || CSS.supports('top: constant(a)'));
      document.write(
        '<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no' +
          (coverSupport ? ',viewport-fit=cover' : '') +
          '" />',
      );
    </script>
    <title>斗地主</title>
    <!--preload-links-->
    <!--app-context-->
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
