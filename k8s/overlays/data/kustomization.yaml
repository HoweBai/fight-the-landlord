apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# 迁移夜建卷/起数据层用：不含任何业务镜像与占位符（edge/gateway 等由 deploy-k3s 统一渲染）。
resources:
  - ../../base/pvcs.yaml
  - ../../base/mysql.yaml
  - ../../base/redis.yaml
patches:
  - target: { kind: StatefulSet }
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value: [{ name: ghcr-pull }]
