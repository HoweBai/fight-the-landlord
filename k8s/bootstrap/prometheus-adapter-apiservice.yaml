# 一次性 bootstrap：custom metrics APIService 指向 prometheus-adapter。
# 自签证书 + insecureSkipTLSVerify（phase 1 不引入 cert-manager）。
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1beta2.custom.metrics.k8s.io
spec:
  service:
    name: prometheus-adapter
    namespace: ftl-monitoring
    port: 443
  group: custom.metrics.k8s.io
  version: v1beta2
  insecureSkipTLSVerify: true
  groupPriorityMinimum: 100
  versionPriority: 200
