# 一次性 bootstrap：集群级资源。由管理员用 cluster-admin kubeconfig 执行一次。
# 日常部署账户（ftl-deployer）没有集群级写权限。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: ftl-prometheus }
rules:
  - apiGroups: [""]
    resources: [nodes, nodes/metrics, services, endpoints, pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: ftl-prometheus }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ftl-prometheus }
subjects: [{ kind: ServiceAccount, name: prometheus, namespace: ftl-monitoring }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: ftl-kube-state-metrics }
rules:
  - apiGroups: [""]
    resources: [pods, nodes, services, endpoints, namespaces, persistentvolumeclaims, persistentvolumes, replicationcontrollers, resourcequotas, secrets, configmaps]
    verbs: [list, watch]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [list, watch]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [list, watch]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [list, watch]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: ftl-kube-state-metrics }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ftl-kube-state-metrics }
subjects: [{ kind: ServiceAccount, name: kube-state-metrics, namespace: ftl-monitoring }]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: ftl-deployer-read }
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: ftl-deployer-read }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: ftl-deployer-read }
subjects: [{ kind: ServiceAccount, name: ftl-deployer, namespace: ftl }]
