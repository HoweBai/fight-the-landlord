apiVersion: v1
kind: ServiceAccount
metadata: { name: ftl-deployer, namespace: ftl }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ftl-deployer, namespace: ftl }
rules:
  - apiGroups: [""]
    resources: [pods, pods/exec, pods/log, services, configmaps, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ftl-deployer, namespace: ftl }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ftl-deployer }
subjects: [{ kind: ServiceAccount, name: ftl-deployer, namespace: ftl }]
---
apiVersion: v1
kind: ServiceAccount
metadata: { name: ftl-deployer, namespace: ftl-monitoring }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: ftl-deployer, namespace: ftl-monitoring }
rules:
  - apiGroups: [""]
    resources: [pods, pods/exec, pods/log, pods/portforward, services, configmaps, persistentvolumeclaims, serviceaccounts]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: ftl-deployer, namespace: ftl-monitoring }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: ftl-deployer }
subjects: [{ kind: ServiceAccount, name: ftl-deployer, namespace: ftl }]
