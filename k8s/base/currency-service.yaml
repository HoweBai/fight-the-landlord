apiVersion: v1
kind: Service
metadata:
  name: currency-service
  namespace: ftl
  labels: { app: currency-service }
spec:
  selector: { app: currency-service }
  ports:
    - { name: http, port: 3004, targetPort: 3004 }
    - { name: rpc, port: 3104, targetPort: 3104 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: currency-service
  namespace: ftl
  labels: { app: currency-service }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: currency-service }
  template:
    metadata:
      labels: { app: currency-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9004"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: currency-service
          image: ghcr.io/howebai/fight-the-landlord-currency-service:IMAGE_TAG_PLACEHOLDER
          ports:
            - { name: http, containerPort: 3004 }
            - { name: rpc, containerPort: 3104 }
            - { name: metrics, containerPort: 9004 }
          env:
            - { name: DB_HOST, value: mysql }
            - { name: DB_PORT, value: "3306" }
            - { name: DB_USER, value: root }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: DB_PASSWORD } }
            - { name: DB_NAME, value: fight_the_landlord }
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: RPC_PORT, value: "3104" }
            - { name: CONFIG_SERVICE_RPC_HOST, value: config-service }
            - { name: CONFIG_SERVICE_RPC_PORT, value: "3106" }
            - { name: USER_SERVICE_RPC_HOST, value: user-service }
            - { name: USER_SERVICE_RPC_PORT, value: "3101" }
            - name: AGENT_JWT_SECRET
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: AGENT_JWT_SECRET } }
            - name: AGENT_PHONE_HMAC_KEY
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: AGENT_PHONE_HMAC_KEY } }
            - name: AD_CHANNEL_PULL_TOKEN
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: AD_CHANNEL_PULL_TOKEN } }
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: INTERNAL_SERVICE_TOKEN } }
            - { name: DB_MIGRATIONS_RUN, value: "false" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3004 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health/live, port: 3004 }
            initialDelaySeconds: 30
            periodSeconds: 20
