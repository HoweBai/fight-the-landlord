# 监控栈（ftl-monitoring）。配置进镜像/ConfigMap，数据卷全部钉 node-a。
apiVersion: v1
kind: ServiceAccount
metadata: { name: prometheus, namespace: ftl-monitoring }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: ftl-monitoring, labels: { app: prometheus } }
spec:
  selector: { app: prometheus }
  ports: [ { name: http, port: 9090, targetPort: 9090 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: ftl-monitoring, labels: { app: prometheus } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      priorityClassName: ftl-monitoring
      serviceAccountName: prometheus
      nodeSelector: { ftl-data: "true" }
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: prometheus
          image: ghcr.io/howebai/fight-the-landlord-prometheus:IMAGE_TAG_PLACEHOLDER
          ports: [ { name: http, containerPort: 9090 } ]
          env:
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: INTERNAL_SERVICE_TOKEN } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          readinessProbe:
            {
              httpGet: { path: /-/ready, port: 9090 },
              initialDelaySeconds: 10,
              periodSeconds: 10
            }
          livenessProbe:
            {
              httpGet: { path: /-/healthy, port: 9090 },
              initialDelaySeconds: 30,
              periodSeconds: 20
            }
          volumeMounts:
            - {
                name: config,
                mountPath: /etc/prometheus/prometheus.yml,
                subPath: prometheus.yml
              }
            - {
                name: k8s-rules,
                mountPath: /etc/prometheus/rules/k8s-extra.yml,
                subPath: rules-k8s.yml,
                readOnly: true
              }
            - { name: data, mountPath: /prometheus }
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: config
          configMap: { name: prometheus-config }
        - name: k8s-rules
          configMap: { name: prometheus-k8s-rules }
        - name: data
          persistentVolumeClaim: { claimName: prometheus-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: ftl-monitoring, labels: { app: grafana } }
spec:
  selector: { app: grafana }
  ports: [ { name: http, port: 3010, targetPort: 3010 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: ftl-monitoring, labels: { app: grafana } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      priorityClassName: ftl-monitoring
      nodeSelector: { ftl-data: "true" }
      securityContext:
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: grafana
          image: ghcr.io/howebai/fight-the-landlord-grafana:IMAGE_TAG_PLACEHOLDER
          ports: [ { name: http, containerPort: 3010 } ]
          env:
            - { name: GF_SERVER_HTTP_PORT, value: "3010" }
            - { name: GF_SERVER_SERVE_FROM_SUB_PATH, value: "true" }
            - name: GF_SERVER_ROOT_URL
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: GRAFANA_ROOT_URL } }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: GRAFANA_ADMIN_PASSWORD } }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - { name: GF_METRICS_ENABLED, value: "true" }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          readinessProbe:
            {
              httpGet: { path: /api/health, port: 3010 },
              initialDelaySeconds: 10,
              periodSeconds: 10
            }
          volumeMounts: [ { name: data, mountPath: /var/lib/grafana }, { name: tmp, mountPath: /tmp } ]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: grafana-data }
        - name: tmp
          emptyDir: {}
---
