apiVersion: v1
kind: Service
metadata: { name: alert-relay, namespace: ftl-monitoring, labels: { app: alert-relay } }
spec:
  selector: { app: alert-relay }
  ports: [ { name: http, port: 8090, targetPort: 8090 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: alert-relay, namespace: ftl-monitoring, labels: { app: alert-relay } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: alert-relay } }
  template:
    metadata: { labels: { app: alert-relay } }
    spec:
      priorityClassName: ftl-monitoring
      nodeSelector: { ftl-data: "true" }
      securityContext:
        fsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: alert-relay
          image: ghcr.io/howebai/fight-the-landlord-alert-relay:IMAGE_TAG_PLACEHOLDER
          ports: [ { name: http, containerPort: 8090 } ]
          env:
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: INTERNAL_SERVICE_TOKEN } }
            - name: NOTIFY_CHANNEL_PULL_TOKEN
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: NOTIFY_CHANNEL_PULL_TOKEN } }
            - { name: CONFIG_SERVICE_RPC_HOST, value: config-service.ftl.svc }
            - { name: CONFIG_SERVICE_RPC_PORT, value: "3106" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          readinessProbe:
            {
              httpGet: { path: /health, port: 8090 },
              initialDelaySeconds: 5,
              periodSeconds: 10
            }
          volumeMounts: [ { name: data, mountPath: /data }, { name: tmp, mountPath: /tmp } ]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: relay-data }
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: am-renderer, namespace: ftl-monitoring, labels: { app: am-renderer } }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: am-renderer } }
  template:
    metadata: { labels: { app: am-renderer } }
    spec:
      priorityClassName: ftl-monitoring
      nodeSelector: { ftl-data: "true" }
      securityContext:
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: am-renderer
          image: ghcr.io/howebai/fight-the-landlord-alert-relay:IMAGE_TAG_PLACEHOLDER
          command: [ "node", "packages/alert-relay/dist/am-renderer.js" ]
          env:
            - name: NOTIFY_CHANNEL_PULL_TOKEN
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: NOTIFY_CHANNEL_PULL_TOKEN } }
            - { name: CONFIG_SERVICE_RPC_HOST, value: config-service.ftl.svc }
            - { name: CONFIG_SERVICE_RPC_PORT, value: "3106" }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }
          readinessProbe:
            exec: { command: [ "sh", "-c", "test -f /alertmanager-live/alertmanager.yml" ] }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            [
              { name: live, mountPath: /alertmanager-live },
              { name: tmp, mountPath: /tmp }
            ]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: live
          persistentVolumeClaim: { claimName: alertmanager-live }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  {
    name: node-exporter,
    namespace: ftl-monitoring,
    labels: { app: node-exporter }
  }
spec:
  clusterIP: None
  selector: { app: node-exporter }
  ports: [ { name: metrics, port: 9100, targetPort: 9100 } ]
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  {
    name: node-exporter,
    namespace: ftl-monitoring,
    labels: { app: node-exporter }
  }
spec:
  selector: { matchLabels: { app: node-exporter } }
  template:
    metadata: { labels: { app: node-exporter } }
    spec:
      priorityClassName: ftl-monitoring
      tolerations: [ { operator: Exists } ]
      containers:
        - name: node-exporter
          image: prom/node-exporter:v1.12.1
          args:
            - --path.procfs=/host/proc
            - --path.sysfs=/sys
          ports: [ { name: metrics, containerPort: 9100 } ]
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 200m, memory: 256Mi }
          readinessProbe:
            {
              httpGet: { path: /metrics, port: 9100 },
              initialDelaySeconds: 5,
              periodSeconds: 15
            }
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: host-proc
              mountPath: /host/proc
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
      volumes:
        - name: tmp
          emptyDir: {}
        - name: host-proc
          hostPath:
            path: /proc
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      hostPID: true
---
