apiVersion: v1
kind: Service
metadata:
  name: room-service
  namespace: ftl
  labels: { app: room-service }
spec:
  clusterIP: None
  selector: { app: room-service }
  ports:
    - { name: http, port: 3002, targetPort: 3002 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-service
  namespace: ftl
  labels: { app: room-service }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: room-service }
  template:
    metadata:
      labels: { app: room-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9002"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: room-service } }
      containers:
        - name: room-service
          image: ghcr.io/howebai/fight-the-landlord-room-service:IMAGE_TAG_PLACEHOLDER
          ports:
            - { name: http, containerPort: 3002 }
            - { name: metrics, containerPort: 9002 }
          env:
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: GAME_SERVICE_RPC_HOST, value: game-service }
            - { name: GAME_SERVICE_RPC_PORT, value: "3103" }
            - { name: ROBOT_SERVICE_RPC_HOST, value: robot-service }
            - { name: ROBOT_SERVICE_RPC_PORT, value: "3105" }
            - { name: CONFIG_SERVICE_RPC_HOST, value: config-service }
            - { name: CONFIG_SERVICE_RPC_PORT, value: "3106" }
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: INTERNAL_SERVICE_TOKEN } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3002 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health/live, port: 3002 }
            initialDelaySeconds: 30
            periodSeconds: 20
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 30"] }
