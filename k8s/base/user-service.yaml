apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ftl
  labels: { app: user-service }
spec:
  selector: { app: user-service }
  ports:
    - { name: http, port: 3001, targetPort: 3001 }
    - { name: rpc, port: 3101, targetPort: 3101 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ftl
  labels: { app: user-service }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9001"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: user-service
          image: ghcr.io/howebai/fight-the-landlord-user-service:IMAGE_TAG_PLACEHOLDER
          ports:
            - { name: http, containerPort: 3001 }
            - { name: rpc, containerPort: 3101 }
            - { name: metrics, containerPort: 9001 }
          env:
            - { name: DB_HOST, value: mysql }
            - { name: DB_PORT, value: "3306" }
            - { name: DB_USER, value: root }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: DB_PASSWORD } }
            - { name: DB_NAME, value: fight_the_landlord }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: JWT_SECRET } }
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: RPC_PORT, value: "3101" }
            - { name: CURRENCY_SERVICE_RPC_HOST, value: currency-service }
            - { name: CURRENCY_SERVICE_RPC_PORT, value: "3104" }
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: INTERNAL_SERVICE_TOKEN } }
            - { name: DB_MIGRATIONS_RUN, value: "false" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3001 }
            initialDelaySeconds: 30
            periodSeconds: 20
