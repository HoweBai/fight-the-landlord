apiVersion: v1
kind: Service
metadata:
  name: robot-service
  namespace: ftl
  labels: { app: robot-service }
spec:
  selector: { app: robot-service }
  ports:
    - { name: http, port: 3005, targetPort: 3005 }
    - { name: rpc, port: 3105, targetPort: 3105 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: robot-service
  namespace: ftl
  labels: { app: robot-service }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: robot-service }
  template:
    metadata:
      labels: { app: robot-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9005"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: robot-service
          image: ghcr.io/howebai/fight-the-landlord-robot-service:IMAGE_TAG_PLACEHOLDER
          ports:
            - { name: http, containerPort: 3005 }
            - { name: rpc, containerPort: 3105 }
            - { name: metrics, containerPort: 9005 }
          env:
            - { name: DOUZERO_URL, value: "http://douzero:2021" }
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: RPC_PORT, value: "3105" }
            - { name: CONFIG_SERVICE_RPC_HOST, value: config-service }
            - { name: CONFIG_SERVICE_RPC_PORT, value: "3106" }
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: INTERNAL_SERVICE_TOKEN } }
          resources:
            requests: { cpu: 500m, memory: 1Gi }
            limits: { cpu: 1, memory: 2Gi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3005 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3005 }
            initialDelaySeconds: 30
            periodSeconds: 20
