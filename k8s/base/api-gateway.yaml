apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ftl
  labels: { app: api-gateway }
spec:
  clusterIP: None
  selector: { app: api-gateway }
  ports:
    - name: http
      port: 3000
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ftl
  labels: { app: api-gateway }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector: { matchLabels: { app: api-gateway } }
      containers:
        - name: api-gateway
          image: ghcr.io/howebai/fight-the-landlord-api-gateway:IMAGE_TAG_PLACEHOLDER
          ports:
            - { name: http, containerPort: 3000 }
            - { name: metrics, containerPort: 9000 }
          env:
            - { name: USER_SERVICE_URL, value: "http://user-service:3001" }
            - { name: ROOM_SERVICE_URL, value: "http://room-service:3002" }
            - { name: ROOM_SERVICE_WS_URL, value: "http://room-service:3002" }
            - { name: GAME_SERVICE_URL, value: "http://game-service:3003" }
            - { name: CONFIG_SERVICE_URL, value: "http://config-service:3006" }
            - { name: CURRENCY_SERVICE_URL, value: "http://currency-service:3004" }
            - { name: PAYMENT_SERVICE_URL, value: "http://payment-service:3007" }
            - { name: CONFIG_SERVICE_RPC_HOST, value: config-service }
            - { name: CONFIG_SERVICE_RPC_PORT, value: "3106" }
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - name: JWT_SECRET
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: JWT_SECRET } }
            - name: ADMIN_JWT_SECRET
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: ADMIN_JWT_SECRET } }
            - name: AGENT_JWT_SECRET
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: AGENT_JWT_SECRET } }
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: INTERNAL_SERVICE_TOKEN } }
            - name: TRUST_PROXY
              valueFrom: { configMapKeyRef: { name: ftl-config, key: TRUST_PROXY } }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 250m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health/live, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 20
          lifecycle:
            preStop:
              exec: { command: ["sh", "-c", "sleep 30"] }
