apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: ftl
  labels: { app: mysql }
spec:
  clusterIP: None
  selector: { app: mysql }
  ports:
    - name: mysql
      port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: ftl
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      nodeSelector: { ftl-role: data }
      terminationGracePeriodSeconds: 120
      securityContext: { fsGroup: 999 }
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - { name: mysql, containerPort: 3306 }
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: DB_PASSWORD } }
            - { name: MYSQL_DATABASE, value: fight_the_landlord }
          resources:
            requests: { cpu: 500m, memory: 2Gi }
            limits: { cpu: 500m, memory: 2Gi }
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 60
            periodSeconds: 20
          volumeMounts:
            - { name: mysql-data, mountPath: /var/lib/mysql }
  volumeClaimTemplates:
    - metadata: { name: mysql-data }
      spec:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 20Gi } }
