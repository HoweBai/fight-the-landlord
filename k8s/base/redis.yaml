apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: ftl
  labels: { app: redis }
spec:
  clusterIP: None
  selector: { app: redis }
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  namespace: ftl
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      priorityClassName: ftl-data-critical
      nodeSelector: { ftl-data: "true" }
      terminationGracePeriodSeconds: 60
      securityContext: { fsGroup: 999 }
      containers:
        - name: redis
          image: redis:7-alpine
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - noeviction
          ports:
            - { name: redis, containerPort: 6379 }
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: 250m, memory: 1Gi }
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - { name: redis-data, mountPath: /data }
  volumeClaimTemplates:
    - metadata: { name: redis-data }
      spec:
        storageClassName: local-path
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 5Gi } }
