apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ftl
  labels: { app: payment-service }
spec:
  selector: { app: payment-service }
  ports:
    - { name: http, port: 3007, targetPort: 3007 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ftl
  labels: { app: payment-service }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9007"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: payment-service
          image: ghcr.io/howebai/fight-the-landlord-payment-service:IMAGE_TAG_PLACEHOLDER
          ports:
            - { name: http, containerPort: 3007 }
            - { name: metrics, containerPort: 9007 }
          env:
            - { name: DB_HOST, value: mysql }
            - { name: DB_PORT, value: "3306" }
            - { name: DB_USER, value: root }
            - name: DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: DB_PASSWORD } }
            - { name: DB_NAME, value: fight_the_landlord }
            - { name: REDIS_URL, value: "redis://redis:6379" }
            - { name: CONFIG_SERVICE_RPC_HOST, value: config-service }
            - { name: CONFIG_SERVICE_RPC_PORT, value: "3106" }
            - name: PAY_CHANNEL_PULL_TOKEN
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: PAY_CHANNEL_PULL_TOKEN } }
            - name: INTERNAL_SERVICE_TOKEN
              valueFrom: { secretKeyRef: { name: ftl-secrets, key: INTERNAL_SERVICE_TOKEN } }
            - { name: DB_MIGRATIONS_RUN, value: "false" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
          readinessProbe:
            httpGet: { path: /api/health, port: 3007 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health/live, port: 3007 }
            initialDelaySeconds: 30
            periodSeconds: 20
