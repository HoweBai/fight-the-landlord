# push→master 时把 14 个自建镜像构建并推到 GHCR（R1304 的触发分级：feature 分支**不**跑）。
#
# 2026-10-27：增加 **workflow_dispatch** 入口 —— 给 dev/测试服手动出镜像，避免本机构建。
# 手动路径**只推 input 指定的 tag，不推 `latest`**（防止 dev 镜像覆盖 master 的 latest）。
#
# ⚠️ 为什么不放在 `ci.yml` 里：`ci.yml` 只是六阶段（`scripts/ci.sh`）的薄调用；
#    把构建塞进去会让「六阶段」不再是规格里那张表。
name: images

on:
  push:
    branches: [master]
    # 2026-10-27：测试服/ dev tag 触发 GitHub 构建（tag 上的 workflow 文件即生效，
    # 不要求该触发器已在默认分支）。`dev-*` 只构建推送同名 tag，不碰 `latest`。
    tags: ['dev-*']
  workflow_dispatch:
    inputs:
      image_tag:
        # 自由文本：经 env 传入、在 shell 里带引号引用（同 release.yml 的 REF_NAME 纪律）。
        description: '要构建推送的镜像 tag（如 dev-cbab81f）；只构建推送，不部署'
        required: true
        type: string

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # ⚠️ 推 GHCR 私有包**必须**有 write；缺了会在 push 那一步 403。
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # ⚠️ 内置 token，**不是**长期密钥 ⇒ 服务器侧与仓库侧都没有长期凭据（R1306）。
          password: ${{ secrets.GITHUB_TOKEN }}
      # ⚠️ `-af` 只在 **runner 侧**允许（一次性机器）；服务器侧只许 `-f`（R1307/R1314）。
      - name: 清理 runner 磁盘
        run: docker image prune -af || true
      - name: 构建并推送 14 个镜像
        env:
          IMAGE_PREFIX: ghcr.io/howebai/fight-the-landlord
          # 手动入口的 tag 与 tag push 的 ref 名都走 env（自由文本不得直接插进 run: 的 shell 源码）。
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          SHORT="$(git rev-parse HEAD | cut -c1-7)"
          if [ -n "$IMAGE_TAG_INPUT" ]; then
            bash scripts/deploy/build-images.sh "$IMAGE_TAG_INPUT"
          elif [ "$REF_TYPE" = "tag" ]; then
            bash scripts/deploy/build-images.sh "$REF_NAME"
          else
            bash scripts/deploy/build-images.sh "sha-$SHORT" latest
          fi
