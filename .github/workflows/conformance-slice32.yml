# 临时工作流（2026-10-26）：只跑代理分润 slice-32 真库组。
# 用途：全序 conformance 因并行 PDK 片/既有边缘片噪声无法快速迭代本片时，单独取证。
# ⚠️ 跑完即删（不得留在 dev/master）；不进 CASES/baselines 的正式认定。
name: conformance-slice32

on:
  push:
    branches: [dev]

jobs:
  slice32:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build --filter=@fight-the-landlord/conformance...
      - name: 起真栈
        env:
          ADMIN_PASSWORD: conformance-admin-pass
        run: bash scripts/deploy/conformance-stack.sh up
      - name: 跑 slice-32-agent
        env:
          ADMIN_PASSWORD: conformance-admin-pass
        run: node tools/conformance/dist/run.js slice-32-agent
      - name: 收尾（无论成败）
        if: always()
        run: bash scripts/deploy/conformance-stack.sh down || true
