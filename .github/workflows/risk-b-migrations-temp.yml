# 临时（B 组真栈轮）：真 MySQL 8 上跑两条迁移的 up/down。跑完删除本文件与脚本。
# ⚠️ 本文件只用于取证，不属于最终分支；最终分支的工作流集合仍为 4 个（slice-07.4 钉住）。
name: risk-b-migrations-temp

on:
  push:
    branches: [feature/pdk-risk-b]
  workflow_dispatch:

jobs:
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: '%'
          MYSQL_DATABASE: ftl
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 迁移类在 dist；带 `...` 连同 workspace 依赖一起构建。
      - run: pnpm exec turbo run build --filter=@fight-the-landlord/config-service... --filter=@fight-the-landlord/user-service...
      - name: 真 MySQL 跑迁移 up/down
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: '3306'
          MYSQL_USER: root
          MYSQL_PASSWORD: root
          MYSQL_DATABASE: ftl
        run: node scripts/temp/verify-risk-b-migrations.mjs
